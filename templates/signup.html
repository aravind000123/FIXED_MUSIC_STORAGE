<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                box-sizing: border-box;
                font-family: 'Consolas', 'Monaco', monospace; /* Tech/Code font */
            }

            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                /* Dark night background with a hint of purple */
                background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
                overflow: hidden;
            }

            table {
                background: rgba(15, 15, 27, 0.8);
                color: #00d4ff; /* Neon Blue Text */
                padding: 40px;
                border-radius: 20px;
                /* The Neon Glow */
                border: 1px solid #00d4ff;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.2), inset 0 0 10px rgba(0, 212, 255, 0.1);
                font-size: 100%;
                border-collapse: separate;
                border-spacing: 0 15px;
                width: 420px;
            }

            td {
                padding: 5px 10px;
            }

            /* Labels */
            td:first-child {
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 1px;
                font-size: 0.8em;
                color: #e94560; /* Neon Pink/Red Contrast */
            }

            /* Dark Input Styling */
            input {
                width: 100%;
                padding: 12px;
                background: #16213e;
                border: 1px solid #444;
                border-radius: 4px;
                color: #fff;
                outline: none;
                transition: 0.3s;
            }

            input:focus {
                border-color: #00d4ff;
                box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            }

            input::placeholder {
                color: #555;
            }

            .button {
                text-align: center;
                padding-top: 25px;
            }

            button {
                width: 100%;
                color: #fff;
                background: transparent;
                border: 2px solid #00d4ff;
                border-radius: 4px;
                padding: 15px;
                font-size: 16px;
                font-weight: bold;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.4s;
                position: relative;
                overflow: hidden;
            }

            button:hover {
                background: #00d4ff;
                color: #1a1a2e;
                box-shadow: 0 0 30px #00d4ff;
            }

            a {
                color: #e94560;
                text-decoration: none;
                font-weight: bold;
            }

            a:hover {
                text-shadow: 0 0 8px #e94560;
                text-decoration: underline;
            }

            /* Centering the last row */
            tr:last-child td {
                text-align: center;
                padding-top: 15px;
                font-size: 0.8em;
                color: #888;
            }

            @media (max-width: 450px) {
                table { width: 95%; padding: 20px; }
            }
        </style>
    </head>
    <body>
        <form method="POST" action="/signup">
            <table>
                <tr><td>First Name</td><td><input name="fname" id="fname" type="text" placeholder="USER_FIRST_NAME" REQUIRED></td></tr>
                <tr><td>Last Name</td><td><input name="lname" id="lname" type="text" placeholder="USER_LAST_NAME" REQUIRED></td></tr>
                <tr><td>Email</td><td><input name="email" id="email" type="email" placeholder="EMAIL@SERVER.COM" REQUIRED></td></tr>
                <tr><td>Password</td><td><input name="password" id="password" type="password" placeholder="********" REQUIRED></td></tr>
                <tr><td>confirm-Password</td><td><input name="checkpassword" id="checkpassword" type="password" placeholder="********" REQUIRED></td></tr>
                <tr><td colspan="2" class="button"><button type="submit">INITIALIZE_SUBMIT</button></td></tr>
                <tr><td colspan="2">Already have an account? <a href="/login_page">LOGIN_NOW</a></td></tr>
            </table> 
        </form> 
        <script>
            document.querySelector("form").onsubmit=function(){
                pass1=document.getElementById("password").value;
                pass2=document.getElementById("checkpassword").value;
                if(pass1!=pass2){
                    alert("ACCESS_DENIED: Passwords do not match");
                    return false;
                }
            }
        </script>        
    </body>
</html>
